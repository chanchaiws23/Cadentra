name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run check:bundle
      - run: npm audit --audit-level=high
      - name: Scan tracked files for common secret formats
        run: |
          ! git grep -En '(service_role|sk-[A-Za-z0-9_-]{20,}|client_secret["'"']?\s*[:=]\s*["'"'][^"'"']+)' -- ':!package-lock.json' ':!.github/workflows/ci.yml'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npm run android:sync
      - run: chmod +x apps/android/gradlew
      - run: apps/android/gradlew -p apps/android assembleDebug
